<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable — Flowdee</title>
    <meta name="description" content="Cette page n'existe pas ou plus. Retournez à l'accueil de Flowdee." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#141A24" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <style>
      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        background: #141A24;
        color: #F5F2EA;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }

      .card {
        max-width: 460px;
      }

      .code {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #D4B273;
        margin: 0 0 16px;
      }

      h1 {
        font-size: clamp(28px, 5vw, 40px);
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.01em;
        margin: 0 0 16px;
      }

      p {
        font-size: 16px;
        line-height: 1.6;
        color: #B8C0CC;
        margin: 0 0 32px;
      }

      a.home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 48px;
        padding: 0 28px;
        border-radius: 999px;
        background: #D4B273;
        color: #141A24;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }

      a.home svg {
        flex-shrink: 0;
      }

      a.home:hover,
      a.home:focus-visible {
        opacity: 0.88;
      }

      a.home:focus-visible {
        outline: 2px solid #D4B273;
        outline-offset: 3px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <p class="code">Erreur 404</p>
      <h1>Cette page n'existe pas.</h1>
      <p>Le lien est peut-être obsolète ou l'adresse mal saisie. L'audit UX, les cas clients et le contact sont sur la page d'accueil.</p>
      <a class="home" href="/">
        Retour à l'accueil
        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
          <path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z" />
        </svg>
      </a>
    </div>
  </body>
</html>
