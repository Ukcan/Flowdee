      <!-- Thème appliqué avant le premier rendu.
           App.tsx pose aussi la classe, mais depuis un useEffect : elle arrivait
           donc après la première peinture, ce qui laissait certains éléments
           figés sur les couleurs du thème clair (texte brun sur navy, contraste
           ~2:1). Même logique que l'état initial de App.tsx : thème enregistré,
           sinon sombre par défaut. -->
      <script>
        (function () {
          try {
            var saved = localStorage.getItem('theme');
            document.documentElement.classList.toggle('dark', saved ? saved === 'dark' : true);
          } catch (e) {
            document.documentElement.classList.add('dark');
          }
        })();
      </script>
