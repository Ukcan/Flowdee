name: Déployer Flowdee

# Le build Cloudflare (git integration) ne peut pas installer les
# librairies système de Chromium (pas d'accès root dans son bac à sable).
# Ce workflow build (avec prérendu Playwright réel) puis déploie
# directement via wrangler — voir scripts/prerender.mjs pour le détail.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer Chromium + librairies système
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (avec prérendu)
        run: pnpm run build:prerender

      - name: Déployer sur Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
